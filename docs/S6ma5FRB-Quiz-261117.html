<style>
  :root { --bleu:#1f4e79; --vert:#2e7d32; --rouge:#c62828; --orange:#e65100; --gris:#f2f4f7; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background:var(--gris); color:#1a1a1a; }
  .wrap { max-width:760px; margin:0 auto; padding:24px 18px 60px; }
  h1 { color:var(--bleu); font-size:1.6rem; margin:0 0 4px; }
  .sous { color:#555; margin:0 0 22px; }
  .carte { background:#fff; border-radius:14px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input[type=text] { width:100%; font-size:1.2rem; padding:14px; border:2px solid #ccd3dc; border-radius:10px; }
  input:focus { outline:none; border-color:var(--bleu); }
  .btn { display:inline-block; font-size:1.15rem; padding:14px 26px; border:none; border-radius:10px; background:var(--bleu); color:#fff; cursor:pointer; margin-top:20px; text-decoration:none; }
  .btn.sec { background:#fff; color:var(--bleu); border:2px solid var(--bleu); }
  .btn:disabled { opacity:.4; }
  .nav { display:flex; justify-content:space-between; gap:10px; }
  .progress { height:8px; background:#dde3ea; border-radius:4px; margin-bottom:18px; overflow:hidden; }
  .progress div { height:100%; background:var(--bleu); transition:width .3s; }
  .num { color:#666; font-size:.95rem; margin-bottom:6px; }
  .enonce { font-size:1.3rem; line-height:1.5; margin:0 0 18px; }
  .pts { font-size:.9rem; color:#666; }
  .choix { display:block; width:100%; text-align:left; font-size:1.15rem; padding:16px 18px; margin:10px 0; border:2px solid #ccd3dc; border-radius:10px; background:#fff; cursor:pointer; color:#1a1a1a; }
  @media (max-width:480px) { .btn { padding:12px 16px; font-size:1rem; white-space:nowrap; } .wrap { padding:16px 12px 40px; } }
  .symboles { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .sym { min-width:52px; font-size:1.3rem; padding:10px 14px; border:2px solid #ccd3dc; border-radius:10px; background:#fff; color:#1a1a1a; }
  .choix.sel { border-color:var(--bleu); background:#e8f0f9; font-weight:600; }
  .recap li { margin:6px 0; }
  .ok { color:var(--vert); } .ko { color:var(--rouge); }
  .note { font-size:2.2rem; font-weight:700; color:var(--bleu); text-align:center; margin:10px 0; }
  .msg { padding:12px; border-radius:10px; margin-top:16px; }
  .msg.info { background:#e8f0f9; } .msg.err { background:#fdecea; } .msg.warn { background:#fff3e0; }
  .corr { border-left:6px solid; border-radius:8px; padding:12px 14px; margin:12px 0; line-height:1.6; }
  .corr.partiel { border-color:#e65100; background:#fff3e0; }
  .figure { margin:0 0 10px; }
  .corr.bon { border-color:var(--vert); background:#e8f5e9; } .corr.faux { border-color:var(--rouge); background:#fdecea; }
  .corr-t { font-weight:700; } .expl { margin-top:6px; color:#333; font-style:italic; }
  #chrono { position:sticky; top:0; z-index:5; display:none; text-align:center; font-size:1.4rem; font-weight:700;
            padding:10px; background:var(--bleu); color:#fff; font-variant-numeric:tabular-nums; }
  #chrono.urgent { background:var(--rouge); }
  .brouillon { margin:4px 0 14px; padding:14px 16px; border:3px solid #111; border-radius:10px; background:#fff8e1; color:#111; font-weight:800; font-size:1.25rem; line-height:1.4; }
  body.nb { --bleu:#111; --vert:#111; --rouge:#111; --orange:#111; }
  body.nb #chrono, body.nb #chrono.urgent { background:#111; }
  body.nb .progress div { background:#111; }
  body.nb .choix.sel { border:4px solid #111; background:#e6e6e6; }
  body.nb .corr.bon, body.nb .corr.faux, body.nb .corr.partiel { background:#fff; border-left-color:#111; }
  body.nb .corr.faux { border-left-style:double; border-left-width:8px; }
  body.nb .msg.info, body.nb .msg.err, body.nb .msg.warn, body.nb .brouillon { background:#fff; border:2px solid #111; }
  body.nb .sous, body.nb .num, body.nb .pts { color:#222; }
</style>

const $ = s => document.querySelector(s);

/* ---------- utilitaires ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function normaliser(s){ return String(s).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," "); }
function lireNombre(s){
  s = String(s).trim().replace(/\s/g,"").replace(",",".").replace("−","-");
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)) { const [a,b] = s.split("/").map(Number); return b ? a/b : NaN; }
  return s === "" ? NaN : Number(s);
}
function arrondi(x){ return Math.round(x*100)/100; }
function virgule(x){ return String(x).replace(".", ","); }
/* notations mathématiques : écrire \\( ... \\) dans les énoncés (LaTeX) */
function maths(el){
  if (window.renderMathInElement && el) renderMathInElement(el, { delimiters:[{left:"\\(", right:"\\)", display:false}], throwOnError:false });
}
/* version texte simple (pour le mail et le tableur) */
function brut(s){
  s = String(s).replace(/\\\(|\\\)/g, "").replace(/\{,\}/g, ",").replace(/\\times/g, "×").replace(/\\div/g, "÷")
               .replace(/\\cdot/g, "·").replace(/\\(left|right)/g, "").replace(/\\[,;! ]/g, " ");
  for (let i = 0, avant = ""; i < 10 && avant !== s; i++) {
    avant = s;
    s = s.replace(/\^\{([^{}]*)\}/g, (m,a) => a.length === 1 ? "^" + a : `^(${a})`)
         .replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, (m,a,b) => /^[\w.,^]+$/.test(a) && /^[\w.,^]+$/.test(b) ? `${a}/${b}` : `(${a})/(${b})`)
         .replace(/\\sqrt\[3\]\{([^{}]*)\}/g, (m,a) => a.length === 1 ? "∛" + a : `∛(${a})`)
         .replace(/\\sqrt\[4\]\{([^{}]*)\}/g, (m,a) => a.length === 1 ? "∜" + a : `∜(${a})`)
         .replace(/\\sqrt\{([^{}]*)\}/g, (m,a) => a.length === 1 ? "√" + a : `√(${a})`);
  }
  const grec = { alpha:"α", beta:"β", gamma:"γ", delta:"δ", Delta:"Δ", pi:"π", theta:"θ", lambda:"λ", infty:"∞", leq:"≤", geq:"≥", neq:"≠", in:"∈", cdots:"…", ldots:"…" };
  return s.replace(/\\mathbb\{?R\}?/g, "ℝ").replace(/\\mathbb\{?N\}?/g, "ℕ").replace(/\\mathbb\{?Z\}?/g, "ℤ").replace(/\\([a-zA-Z]+)/g, (m,w) => grec[w] || w).replace(/[{}]/g, "").replace(/\s+/g, " ").trim();
}
function maintenant(){ return Date.now() + decalage; }
function heure(ts){ return new Date(ts).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit", second:"2-digit"}); }
function dateHeure(ts){ return new Date(ts).toLocaleString("fr-FR"); }
function mmss(ms){ ms = Math.max(0, ms); const s = Math.ceil(ms/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function dureeTexte(ms){ const m = Math.floor(ms/60000), s = Math.round((ms%60000)/1000); return m ? `${m} min ${s} s` : `${s} s`; }
const tsDebut = CONFIG.debut ? new Date(CONFIG.debut).getTime() : null;
const tsFin = CONFIG.fin ? new Date(CONFIG.fin).getTime() : null;
const tsDernier = CONFIG.dernierDepart ? new Date(CONFIG.dernierDepart).getTime() : tsFin;

/* ---------- sauvegarde sur l'iPad (reprise après rechargement) ---------- */
function cle(){ return "quiz|" + CONFIG.titre + "|" + eleve.candidat; }
function lireEtat(){ try { return JSON.parse(localStorage.getItem(cle())); } catch(e) { return null; } }

/* ---------- heure du serveur ---------- */
async function synchroniserHeure(){
  try {
    const r = await fetch(location.href, { method:"HEAD", cache:"no-store" });
    const d = r.headers.get("Date");
    if (d) decalage = new Date(d).getTime() + 500 - Date.now();
  } catch(e) { /* hors ligne ou fichier local : heure de l'appareil */ }
}

/* ---------- démarrage ---------- */
async function init(){
  $("#titre").textContent = CONFIG.titre;
  $("#sousTitre").textContent = CONFIG.sousTitre || "";
  document.title = CONFIG.titre;
  questions = CONFIG.questions.map((q,i) => ({...q, numOrig:i+1}));
  if (CONFIG.melangerQuestions) questions.sort(() => Math.random() - .5);
  const fixes = questions.filter(q => typeof q.points === "number");
  const libres = questions.filter(q => typeof q.points !== "number");
  const reste = Math.max(0, CONFIG.noteSur - fixes.reduce((s,q) => s + q.points, 0));
  libres.forEach(q => q.points = reste / libres.length);
  reponses = questions.map(() => null);
  ecran.innerHTML = "<p>Chargement…</p>";
  await synchroniserHeure();
  ecranAccueil();
}

function infoCreneau(){
  const t = maintenant();
  if (tsDernier && t > tsDernier) return { ouvert:false, ferme:true, html:`<div class="msg err">Le quiz est fermé depuis ${heure(tsDernier)}.</div>` };
  if (tsDebut && t < tsDebut) {
    const memeJour = new Date(tsDebut).toDateString() === new Date(t).toDateString();
    const quand = memeJour ? "à " + heure(tsDebut) : "le " + dateHeure(tsDebut);
    const att = tsDebut - t;
    const dans = att < 3600000 ? mmss(att) : `${Math.floor(att/3600000)} h ${String(Math.floor(att%3600000/60000)).padStart(2,"0")} min`;
    return { ouvert:false, html:`<div class="msg info">Le quiz commencera <b>${quand}</b> — dans <b>${dans}</b>.</div>` };
  }
  let html = "";
  if (dureeMs) html += `<p>Durée : <b>${CONFIG.dureeMinutes} minutes</b>. À la fin du temps, tes réponses sont envoyées automatiquement.</p>`;
  if (tsFin) html += `<p>Le quiz se ferme à <b>${new Date(tsFin).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"})}</b> : à cette heure, tes réponses sont envoyées même si tu n'as pas fini.</p>`;
  if (tsDebut && t > tsDebut + 60000) html += `<div class="msg warn">Le quiz a commencé à ${heure(tsDebut)}. Ton retard sera signalé à ton professeur.</div>`;
  return { ouvert:true, html };
}

function ecranEntrainement(){
  ecran.innerHTML = `
    <div class="msg info"><b>Mode entraînement.</b> Pas de chronomètre, rien n'est envoyé au professeur.
    À la fin, tu vois ta note et le corrigé. Tu peux recommencer autant de fois que tu veux.</div>
    <p>${questions.length} questions.</p>

function ecranAccueil(){

/* ---------- chronomètre ---------- */
/* temps majoré : CONFIG.tempsMajore = [numéros de candidat] (ligne retirée au déblocage) */
function estMajore(){ return (CONFIG.tempsMajore || []).map(String).map(x => x.trim()).includes(String(eleve.candidat).trim()); }
function dureeEleve(){ return dureeMs * (estMajore() ? 1.25 : 1); }
function lancerChrono(){
  if (CONFIG.entrainement) return;
  if (!dureeMs && !tsFin) return;
  const el = $("#chrono"); el.style.display = "block";
  const tic = () => {
    const reste = Math.min(dureeMs ? etat.debutTs + dureeEleve() : Infinity, tsFin || Infinity) - maintenant();
    el.textContent = "⏱ " + mmss(reste);
    el.classList.toggle("urgent", reste < 60000);
    if (reste <= 0) { clearInterval(minuteur); terminer("temps écoulé"); }
  };
  tic(); clearInterval(minuteur); minuteur = setInterval(tic, 500);
}

/* ---------- questions ---------- */
function ecranQuestion(){
  if (fini) return;
  const q = questions[idx], r = reponses[idx];
  let zone = "";

    zone = q.choix.map((c,i) => `<button class="choix ${r===i?"sel":""}" data-v="${i}">${(c && typeof c === "object") ? c.html : esc(c)}</button>`).join("");

  }

    <div class="num">Question ${idx+1} / ${questions.length} <span class="pts">· ${virgule(pts)} pt${pts>1?"s":""}</span></div>

    <div class="nav">
      <button class="btn sec" id="prec" ${idx===0?"disabled":""}>← Précédente</button>
      <button class="btn" id="suiv">${idx===questions.length-1?"Terminer":"Suivante →"}</button>
    </div>`;
  ecran.querySelectorAll(".choix").forEach(b => b.onclick = () => {
    reponses[idx] = q.type === "vf" ? (b.dataset.v === "true") : Number(b.dataset.v);

  });

  ecran.querySelectorAll(".sym").forEach(bt => {

    bt.onclick = () => {

      const d = saisie.selectionStart ?? saisie.value.length, f = saisie.selectionEnd ?? d;
      saisie.value = saisie.value.slice(0, d) + c + saisie.value.slice(f);

}

function ecranVerification(){

/* ---------- correction ---------- */
const lib = c => (c && typeof c === "object") ? c.texte : c;   /* choix QCM : texte, ou { html, texte } */
function texteReponse(q, r){
  if (r === null) return "(sans réponse)";
  if (q.type === "qcm") return lib(q.choix[r]);
  if (q.type === "vf") return r ? "Vrai" : "Faux";
  return String(r);
}
function texteCorrection(q){
  if (q.afficheReponse) return q.afficheReponse;
  if (q.type === "qcm") return lib(q.choix[q.reponse]);
  if (q.type === "vf") return q.reponse ? "Vrai" : "Faux";
  if (q.type === "racine") return (q.reponse.a === 1 ? "" : q.reponse.a) + "√" + q.reponse.b;
  if (q.type === "ensemble" || q.type === "point") return q.reponse.map(virgule).join(q.type === "point" ? " ; " : " et ");
  if (q.type === "expression" || q.type === "formule") return [].concat(q.attendu)[0];
  if (q.type === "nombre") return virgule(q.reponse);
  return q.reponses[0];
}
/* ---------- expressions et formules (comparées par leur valeur) ----------
   Variables : x par défaut ; pour une formule, q.variables (ex. ["u","v","u'","v'"]
   ou ["x","a","f(a)","f'(a)"]). Multiplication implicite prioritaire : 6/3x^7 = 6/(3x^7). */
function normaliserSaisie(txt){
  const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  return String(txt).replace(/[’‘´`′]/g, "'")
    .replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => "^(" + [...m].map(c => c === "⁻" ? "-" : SUP.indexOf(c)).join("") + ")")
    .replace(/−/g, "-").replace(/[×·]/g, "*").replace(/:/g, "/").replace(/,/g, ".")
    .replace(/[{}\s]/g, "").toLowerCase();
}
function lireExpression(txt, variables){
  const vars = (variables || ["x"]).map(v => v.toLowerCase()).sort((a, b) => b.length - a.length);
  const s = normaliserSaisie(txt);
  if (!s) return null;
  const t = []; let k = 0;
  while (k < s.length) {
    const v = vars.find(v => s.startsWith(v, k));
    if (v) { t.push({ v }); k += v.length; continue; }
    const n = s.slice(k).match(/^\d+(?:\.\d+)?|^\.\d+/);
    if (n) { t.push(n[0]); k += n[0].length; continue; }
    if ("+-*/^()".includes(s[k])) { t.push(s[k]); k++; continue; }
    return null;
  }
  let i = 0;
  const vu = () => t[i], pris = c => (t[i] === c ? (i++, true) : false);
  const debutFacteur = c => c !== undefined && (typeof c === "object" || c === "(" || /^[\d.]/.test(c));
  function somme(){ let a = produit(); for(;;){ if (pris("+")){ const b = produit(), p = a; a = e => p(e) + b(e); }
    else if (pris("-")){ const b = produit(), p = a; a = e => p(e) - b(e); } else return a; } }
  function produit(){ let a = implicite(); for(;;){ if (pris("*")){ const b = implicite(), p = a; a = e => p(e) * b(e); }
    else if (pris("/")){ const b = implicite(), p = a; a = e => p(e) / b(e); } else return a; } }
  function implicite(){ let a = unaire(); while (debutFacteur(vu())){ const b = puissance(), p = a; a = e => p(e) * b(e); } return a; }
  function unaire(){ if (pris("-")){ const a = unaire(); return e => -a(e); } if (pris("+")) return unaire(); return puissance(); }
  function puissance(){ const a = primaire(); if (pris("^")){ const b = unaire(); return e => Math.pow(a(e), b(e)); } return a; }
  function primaire(){ const c = t[i++];
    if (c === undefined) throw 0;
    if (typeof c === "object") return e => e[c.v];
    if (c === "("){ const a = somme(); if (!pris(")")) throw 0; return a; }
    if (/^[\d.]/.test(c)){ const v = parseFloat(c); return () => v; }
    throw 0; }
  try { const f = somme(); return i === t.length ? f : null; } catch(e) { return null; }
}
function memeExpression(r, attendus, variables){
  const vars = (variables || ["x"]).map(v => v.toLowerCase());
  const a = lireExpression(r, vars);
  if (!a) return false;
  const essais = [0.7, 1.3, 2.1, -1.4, 3.7].map((x, n) => Object.fromEntries(vars.map((v, j) => [v, x + 0.37 * j * (n + 1) + 0.11 * j * j])));
  return [].concat(attendus).some(att => { const b = lireExpression(att, vars); if (!b) return false;
    return essais.every(e => { const u = a(e), w = b(e);
      return isFinite(u) && isFinite(w) && Math.abs(u - w) <= 1e-9 * Math.max(1, Math.abs(w)); }); });
}
/* nombres contenus dans une réponse (« -1 et 3 », « x1 = -1 ; x2 = 3 », « (-1 ; -3) ») */
function nombresDe(r){
  const s = String(r).replace(/−/g, "-").replace(/x\s*[₁₂12]/gi, "x");
  return (s.match(/-?\d+(?:[.,]\d+)?/g) || []).map(t => parseFloat(t.replace(",", ".")));
}
/* fraction irréductible ou entier ? (pour les réponses « à simplifier ») */
function estSimplifie(r){
  const s = String(r).replace(/\s/g, "").replace("−", "-");
  const m = s.match(/^-?(\d+)\/-?(\d+)$/);
  if (!m) return true;
  const pgcd = (a, b) => b ? pgcd(b, a % b) : a;
  const a = +m[1], b = +m[2];
  return b !== 1 && pgcd(a, b) === 1;
}
/* fraction des points obtenue (0 à 1) et message éventuel */
function noter(q, r){
  if (r === null) return { f: 0 };
  if (q.type === "expression" || q.type === "formule") {
    let rep = normaliserSaisie(r), sansPrefixe = false;
    if (q.prefixe) {
      const p = normaliserSaisie(q.prefixe);
      if (rep.startsWith(p)) rep = rep.slice(p.length); else sansPrefixe = true;
    }
    if (!memeExpression(rep, q.attendu, q.variables)) {
      for (const alt of (q.alternatives || []))
        if (memeExpression(rep, alt.attendu, q.variables)) return { f: alt.points / q.points, msg: alt.message || "" };
      return { f: 0 };
    }
    if (q.exigeForme && !new RegExp(q.exigeForme.motif).test(rep)) return { f: 0, msg: q.exigeForme.message || "" };
    if (sansPrefixe && q.sansPrefixe) return { f: q.sansPrefixe.points / q.points, msg: q.sansPrefixe.message || "" };
    if (q.partiel && new RegExp(q.partiel.si).test(String(r)))
      return { f: q.partiel.points / q.points, msg: q.partiel.message || "" };
    return { f: 1 };
  }
  if (q.type === "scientifique" && !estJuste(q, r)) { const v = lireScientifique(r);
    if (!v) { const n = lireNombre(r); if (!isNaN(n) && Math.abs(n - q.reponse) <= 1e-12) return { f: 0, msg: "Valeur juste, mais ce n'est pas l'écriture scientifique a × 10ⁿ." }; }
    else if (Math.abs(v.a * Math.pow(10, v.n) - q.reponse) <= 1e-9 * Math.abs(q.reponse)) return { f: 0, msg: "Valeur juste, mais il faut 1 ≤ a < 10." }; }
  if (q.type === "pi" && !estJuste(q, r) && valeurPi(r) === null && !isNaN(lireNombre(r)) && Math.abs(lireNombre(r) - q.reponse * Math.PI) < 0.01)
    return { f: 0, msg: "Il fallait la valeur exacte avec π." };
  if (q.type === "racine" && !estJuste(q, r)) { const v = lireRacine(r);
    if (v && v.a * v.a * v.b === q.reponse.a * q.reponse.a * q.reponse.b) return { f: 0, msg: "Égalité juste, mais b n'est pas le plus petit possible." }; }
  if (q.type === "nombre" && q.simplifier && estJuste(q, r) && !estSimplifie(r))
    return { f: q.simplifier.points / q.points, msg: q.simplifier.message || "" };
  return { f: estJuste(q, r) ? 1 : 0 };
}
/* notation scientifique : a × 10^n avec 1 ≤ |a| < 10 */
function lireScientifique(r){
  const s = normaliserSaisie(r).replace(/[x*·]/g, "×");
  const m = s.match(/^(-?\d+(?:\.\d+)?)(?:×|\.)10\^\(?(-?\d+)\)?$/);
  return m ? { a: parseFloat(m[1]), n: parseInt(m[2], 10) } : null;
}
/* valeur exacte avec π (« π/2 », « pi/2 », « 1/2π »…) */
function valeurPi(r){
  const s = normaliserSaisie(r).replace(/pi/g, "π").replace(/(\d+)\/(\d+)π/g, "($1/$2)π");
  if (!s.includes("π")) return null;
  const f = lireExpression(s, ["π"]);
  return f ? f({ "π": Math.PI }) : null;
}
/* a√b (« 2√7 », « 2*√(7) », « 2racine7 ») → { a, b } */
function lireRacine(r){
  const s = normaliserSaisie(r).replace(/racine|rac|sqrt/g, "√").replace(/\*/g, "");
  const m = s.match(/^(\d*)√\(?(\d+)\)?$/);
  return m ? { a: m[1] === "" ? 1 : parseInt(m[1], 10), b: parseInt(m[2], 10) } : null;
}
function estJuste(q, r){
  if (r === null) return false;
  if (q.type === "racine") { const v = lireRacine(r); return !!v && v.a === q.reponse.a && v.b === q.reponse.b; }
  if (q.type === "scientifique") { const v = lireScientifique(r);
    return !!v && Math.abs(v.a) >= 1 && Math.abs(v.a) < 10 && Math.abs(v.a * Math.pow(10, v.n) - q.reponse) <= 1e-9 * Math.abs(q.reponse); }
  if (q.type === "pi") { const v = valeurPi(r); return v !== null && Math.abs(v - q.reponse * Math.PI) <= 1e-9; }
  if (q.type === "expression" || q.type === "formule") return false;
  if (q.type === "qcm" || q.type === "vf") return r === q.reponse;
  if (q.type === "nombre") { const n = lireNombre(r); return !isNaN(n) && Math.abs(n - q.reponse) <= (q.tolerance || 1e-9); }
  if (q.type === "ensemble" || q.type === "point") {
    const n = nombresDe(r);
    if (n.length !== q.reponse.length) return false;
    const a = q.type === "ensemble" ? [...n].sort((u, v) => u - v) : n;
    const b = q.type === "ensemble" ? [...q.reponse].sort((u, v) => u - v) : q.reponse;
    return a.every((x, k) => Math.abs(x - b[k]) <= (q.tolerance || 1e-9));
  }
  return q.reponses.some(a => normaliser(a) === normaliser(r) || normaliserSaisie(a) === normaliserSaisie(r));
}
function corriger(){
  const total = questions.reduce((s,q) => s + q.points, 0);
  let obtenu = 0;
  const details = questions.map((q,i) => {
    const n = noter(q, reponses[i]), juste = n.f === 1, partiel = n.f > 0 && n.f < 1;
    obtenu += q.points * n.f;
    return { num:i+1, enonce:brut(q.enonce), reponseEleve:brut(texteReponse(q, reponses[i])),
             correction:brut(texteCorrection(q)), explication:brut(q.explication || ""),
             tex:{ enonce:q.enonce, reponseEleve:texteReponse(q, reponses[i]), correction:texteCorrection(q), explication:q.explication || "" }, juste,
             partiel, message:n.msg || "", points:arrondi(q.points * n.f), bareme:arrondi(q.points) };
  });
  const note = total ? arrondi(obtenu / total * CONFIG.noteSur) : 0;
  return { note, noteSur:CONFIG.noteSur, nbJustes:details.filter(d=>d.juste).length, details };
}

/* ---------- fin et envoi ---------- */
function terminer(finPar){
  if (fini) return;
  if (CONFIG.entrainement) {
    fini = true; clearInterval(minuteur);
    return ecranFin(corriger(), `<div class="msg info">Mode entraînement : rien n'a été envoyé.</div>
      <button class="btn" onclick="location.reload()">Recommencer</button>`);
  }
  fini = true; clearInterval(minuteur);
  $("#chrono").style.display = "none";
  const finTs = maintenant();
  const retardMs = tsDebut ? Math.max(0, etat.debutTs - tsDebut) : 0;
  const temps = {
    debut: dateHeure(etat.debutTs), remise: dateHeure(finTs),
    dureeUtilisee: dureeTexte(finTs - etat.debutTs),
    retardMin: Math.floor(retardMs / 60000),
    retard: !tsDebut ? "pas d'heure imposée" : retardMs >= 60000 ? `en retard de ${dureeTexte(retardMs)} (début officiel ${heure(tsDebut)})` : "à l'heure",
    finPar
  };
  if (estMajore()) temps.retard += " · temps majoré (+25 %)";
  etat.termine = true; sauver();
  const res = corriger();
  const objet = `${CONFIG.titre} — ${eleve.candidat} ${eleve.prenom} — ${virgule(res.note)}/${res.noteSur}`
              + (temps.retardMin >= 1 ? ` — RETARD ${temps.retardMin} min` : "") + (estMajore() ? " — temps majoré +25 %" : "");
  const corps = texteMail(res, temps);
  const donnees = { quiz:CONFIG.titre, candidat:eleve.candidat, prenom:eleve.prenom + (estMajore() ? " (temps majoré +25 %)" : ""), objet, corps, ...temps, ...res,
                    details: res.details.map(({tex, ...d}) => d) };
  envoyer(res, donnees, finPar);
}

function texteMail(res, t){
  let s = `${CONFIG.titre}\nN° de candidat : ${eleve.candidat}\nPrénom : ${eleve.prenom}\n`;
  s += `Début : ${t.debut} — ${t.retard}\nRemise : ${t.remise} (${t.finPar}, durée ${t.dureeUtilisee})\n\n`;
  s += `NOTE : ${virgule(res.note)} / ${res.noteSur}  (${res.nbJustes} / ${res.details.length} réponses justes)\n\n`;
  res.details.forEach(d => {
    s += `Q${d.num}. ${d.enonce}\n   Réponse de l'élève : ${d.reponseEleve}\n   Correction : ${d.correction}\n`;
    s += `   ${d.juste ? "✔ Juste" : d.partiel ? "½ En partie juste" + (d.message ? " (" + d.message + ")" : "") : "✘ Faux" + (d.message ? " (" + d.message + ")" : "")} — ${virgule(d.points)} / ${virgule(d.bareme)}\n\n`;
  });
  return s;
}

async function envoyer(res, donnees, finPar){
  const intro = finPar === "temps écoulé" ? `<div class="msg warn">Le temps est écoulé.</div>` : "";
  if (!CONFIG.urlAppsScript) {
    const lien = `mailto:${encodeURIComponent(CONFIG.emailEnseignant)}?subject=${encodeURIComponent(donnees.objet)}&body=${encodeURIComponent(donnees.corps)}`;
    return ecranFin(res, intro + `<div class="msg info">Appuie sur le bouton : l'app Mail s'ouvre, puis appuie sur <b>Envoyer</b>.</div><a class="btn" href="${lien}">Ouvrir Mail et envoyer</a>`);
  }
  ecranFin(res, intro + `<div class="msg info">Envoi en cours… ne ferme pas cette page.</div>`);
  for (let essai = 1; ; essai++) {
    try {
      await fetch(CONFIG.urlAppsScript, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(donnees) });
      return ecranFin(res, intro + `<div class="msg info">Tes réponses ont bien été envoyées à ton professeur. Tu peux fermer cette page.</div>`);
    } catch (e) {
      ecranFin(res, intro + `<div class="msg err">Pas de connexion. Nouvel essai automatique dans quelques secondes (essai ${essai})… <b>Ne ferme pas cette page.</b></div>`);
      await new Promise(r => setTimeout(r, 5000));
    }
  }
}

function ecranFin(res, message){
  let bloc = "";
  if (CONFIG.afficherNoteEleve || CONFIG.afficherCorrigeEleve || CONFIG.entrainement)
    bloc += `<div class="note">${virgule(res.note)} / ${res.noteSur}</div>
             <p style="text-align:center">${res.nbJustes} réponse${res.nbJustes>1?"s":""} juste${res.nbJustes>1?"s":""} sur ${res.details.length}</p>`;
  if (CONFIG.afficherCorrigeEleve || CONFIG.entrainement)
    bloc += `<h3>Corrigé</h3>` + res.details.map(d => `
      <div class="corr ${d.juste?"bon":d.partiel?"partiel":"faux"}">
        <div class="corr-t">${d.juste?"✔":d.partiel?"½":"✘"} Question ${d.num} <span class="pts">· ${virgule(d.points)} / ${virgule(d.bareme)}</span></div>
        <div>${esc(d.tex.enonce)}</div>
        <div>Ta réponse : <b>${esc(d.tex.reponseEleve)}</b></div>
        ${!d.juste && d.message ? `<div><b>${esc(d.message)}</b></div>` : ""}
        ${d.juste ? "" : `<div>Bonne réponse : <b>${esc(d.tex.correction)}</b></div>`}
        ${d.tex.explication ? `<div class="expl">${esc(d.tex.explication)}</div>` : ""}
      </div>`).join("");
  ecran.innerHTML = `<h2>${CONFIG.entrainement ? "Terminé !" : "Merci " + esc(eleve.prenom) + " !"}</h2>${message}${bloc}`;
  maths(ecran);
}

if (CONFIG.noirEtBlanc) document.body.classList.add("nb");
init();
</script>
